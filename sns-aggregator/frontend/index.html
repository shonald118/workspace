<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>消息聚合Workspace</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", "PingFang SC", sans-serif; background: #f4f5f7; color: #1a1a1a; }
  header { background: #1f2430; color: #fff; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 18px; margin: 0; }
  .tabs { display: flex; gap: 8px; padding: 12px 24px; background: #fff; border-bottom: 1px solid #e5e7eb; }
  .tab { padding: 6px 16px; border-radius: 16px; cursor: pointer; font-size: 14px; border: 1px solid #ddd; background: #fff; }
  .tab.active { background: #2f6fed; color: #fff; border-color: #2f6fed; }
  .list { max-width: 800px; margin: 16px auto; padding: 0 16px; }
  .card { background: #fff; border-radius: 8px; padding: 14px 16px; margin-bottom: 10px; box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
  .card .meta { font-size: 12px; color: #888; display: flex; justify-content: space-between; margin-bottom: 6px; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 10px; color: #fff; }
  .tag.wecom { background: #07c160; }
  .tag.dingtalk { background: #1677ff; }
  .tag.email { background: #ff8f1f; }
  .title { font-weight: 600; margin-bottom: 4px; }
  .content { font-size: 14px; color: #444; white-space: pre-wrap; }
  .empty { text-align: center; color: #999; padding: 60px 0; }
  button.refresh { background: #2f6fed; color: #fff; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>消息聚合 Workspace</h1>
  <button class="refresh" onclick="loadMessages()">刷新</button>
</header>
<div class="tabs" id="tabs"></div>
<div class="list" id="list"><div class="empty">加载中...</div></div>

<script>
const SOURCES = [
  { key: 'all', label: '全部' },
  { key: 'wecom', label: '企业微信' },
  { key: 'dingtalk', label: '钉钉' },
  { key: 'email', label: '邮箱' },
];
let currentSource = 'all';

function renderTabs() {
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = SOURCES.map(s =>
    `<div class="tab ${s.key === currentSource ? 'active' : ''}" onclick="switchSource('${s.key}')">${s.label}</div>`
  ).join('');
}

function switchSource(key) {
  currentSource = key;
  renderTabs();
  loadMessages();
}

async function loadMessages() {
  const listEl = document.getElementById('list');
  try {
    const res = await fetch(`/api/messages?source=${currentSource}&limit=50`);
    const messages = await res.json();
    if (!messages.length) {
      listEl.innerHTML = '<div class="empty">暂无消息</div>';
      return;
    }
    listEl.innerHTML = messages.map(m => `
      <div class="card">
        <div class="meta">
          <span class="tag ${m.source}">${SOURCES.find(s => s.key === m.source)?.label || m.source}</span>
          <span>${new Date(m.received_at).toLocaleString('zh-CN')}</span>
        </div>
        <div class="title">${escapeHtml(m.title || m.sender || '')}</div>
        <div class="content">${escapeHtml(m.content || '')}</div>
      </div>
    `).join('');
  } catch (err) {
    listEl.innerHTML = `<div class="empty">加载失败: ${err.message}</div>`;
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

renderTabs();
loadMessages();
setInterval(loadMessages, 15000); // 每15秒自动刷新
</script>
</body>
</html>
